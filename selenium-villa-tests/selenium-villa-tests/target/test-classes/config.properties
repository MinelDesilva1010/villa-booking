# Base URL of the running frontend (Vite dev server default shown below).
# Change this to your deployed frontend URL if you're not testing locally.
base.url=http://localhost:5173

# Browser: chrome | firefox
browser=chrome

# Run without opening a visible browser window (true/false)
headless=false

# Explicit wait timeout in seconds
timeout.seconds=10

# Admin panel password (matches ADMIN_PASSWORD in Admin.jsx)
admin.password=admin123
